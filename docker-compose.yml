# chopshop-svg — run the pipeline anywhere with Docker (or podman-compose).
#
# Build once:
#   docker compose build
#
# Run the back half on one SVG (outputs land in ./04_validated and ./05_final):
#   docker compose run --rm chopshop ./pipeline.sh 00_source/art.svg
#
# Run the front half on a raster (candidates in ./02_traced, report in ./04_validated):
#   docker compose run --rm chopshop ./front_pipeline.sh 00_source/art.png
#
# With podman instead of docker: `podman compose` (podman-compose) understands
# this same file.

services:
  runner:
    build: .
    image: chopshop-svg:0.1.0
    working_dir: /app
    command: [".venv/bin/python", "runner.py"]
    environment:
      RUNNER_PORT: "8787"
      RUNNER_BIND: "0.0.0.0"
      RUNNER_ROOT: /data/jobs
      HOST_UPLOAD_ROOT: /home/unodos/chopshop-studio/storage/uploads
      CONTAINER_UPLOAD_ROOT: /data/uploads
      # Optional Jev (TypeSafe System One) add-on. All four are configuration,
      # not facts about this machine, and all four default to unset: leave them
      # so and POST /validations/:id/jev answers 503 with the reason instead of
      # pretending the route does not exist. JEV_ANNOTATOR points at a
      # chopshop-jev checkout's scripts/jev_annotate.py (mount it — the two
      # repos stay separate deliverables, so the question set and verdict logic
      # are never copied into this one). JEV_API_KEY is the operator's own key
      # and never belongs in a tracked file: this repo is public.
      JEV_ANNOTATOR: "${JEV_ANNOTATOR:-}"
      JEV_API_KEY: "${JEV_API_KEY:-}"
      JEV_ENDPOINT: "${JEV_ENDPOINT:-}"
      JEV_MODEL: "${JEV_MODEL:-}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./runner-data/jobs:/data/jobs
      - /home/unodos/chopshop-studio/storage/uploads:/data/uploads:ro
      - ./01_prepped:/app/01_prepped
      - ./02_traced:/app/02_traced
      - ./03_cleaned:/app/03_cleaned
      - ./04_validated:/app/04_validated
      - ./05_final:/app/05_final
    restart: unless-stopped

  chopshop:
    build: .
    image: chopshop-svg:0.1.0
    working_dir: /app
    # Bind-mount inputs, the spec, and the output dirs so results land on the
    # host. The code and venv are baked into the image, not mounted.
    volumes:
      - ./00_source:/app/00_source
      - ./spec.json:/app/spec.json
      - ./01_prepped:/app/01_prepped
      - ./02_traced:/app/02_traced
      - ./03_cleaned:/app/03_cleaned
      - ./04_validated:/app/04_validated
      - ./05_final:/app/05_final
