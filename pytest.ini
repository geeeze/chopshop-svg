[pytest]
# The test suite lives in tests/ and nowhere else. Without this, a bare
# `pytest` at the repo root collects the whole tree -- including runner-data/,
# which the containerised runner writes as root, so collection dies with
# PermissionError depending on which job dirs happen to exist. runner-data/ is
# pipeline OUTPUT, so what a test run may touch belongs here, not in an --ignore
# wrapper script. `pytest` and `pytest tests/` are therefore equivalent.
testpaths = tests
