# SVGO config for print-ready SVG cleanup (pipeline stage 3).
#
# Usage:  svgo --config scripts/svgo_print.yml -i 02_traced/attempt_01/x.svg -o 03_cleaned/x.svg
#
# NOTE: SVGO needs Node.js, which this host does not have. The equivalent
# pure-Python step ships as scripts/snap_colors.py; this config is here so the
# SVGO half of stage 3 can run wherever node is available. The plugins below are
# the ones that matter for print and are safe for traced artwork -- anything
# that merges or rewrites geometry is deliberately left out, because re-flowing
# paths is how clean contours become subtle artefacts.
plugins:
  - name: preset-default
    params:
      overrides:
        # Keep the viewBox: removing it destroys the physical size, which the
        # stroke-width check and the dimensions check both depend on.
        removeViewBox: false
        # Keep width/height: these are what tie user units to millimetres.
        removeDimensions: false
        # Keep ids: the manifest and the failure messages reference them.
        cleanupIds: false
        # Keep <defs> entries that are referenced indirectly or by script.
        removeUselessDefs: false
        # Keep <title>/<desc>: they document the artwork for the printer.
        removeTitle: false
        removeDesc: false
        # Do not re-flow geometry. Decimal precision drives node counts.
        convertPathData: false
        mergePaths: false
        # Do not second-guess the colour model we just snapped to a palette.
        convertColors: false
  - name: cleanupNumericValues
    params:
      floatPrecision: 3
      leadingZero: false
  - name: removeMetadata
  - name: removeComments
